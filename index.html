<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Solitario Klondike</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e5229;
      /* Verde tapete para evitar parpadeos blancos */
    }

    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
